# The same checks as the local pre-commit hook, run on GitHub for every push
# and pull request -- a backstop for commits made with --no-verify or on a
# machine without the hook. Also runs the test suite.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so gitleaks scans every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
      - name: gitleaks over the full history
        run: |
          GL=$(find ~/.cache/pre-commit -type f -name gitleaks -perm -u+x | head -1)
          "$GL" git --no-banner --redact .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
